&lt;aside data-notes=&quot;&quot; class=&quot;hidden&quot;&gt;[PLAYER 4 · 6:55–7:55] Level three continues — we stop listing states and start writing patterns. Regular expressions are the combo language, built from three operators. Union means &quot;or&quot;: a union b accepts a or b. Concatenation means &quot;then&quot;: a b fires a immediately followed by b. Kleene star means &quot;repeat&quot;: a-star is zero or more a&#x27;s — and binding runs star, then concatenation, then union. Two game examples. Input buffering: W-star A — any number of walk frames, then attack fires; one expression, infinite combos. Name check: a letter followed by letters, digits or underscores — the chat engine validates every new player name with one regex. Every regex compiles into a machine: Thompson construction builds an NFA with epsilon-moves, subset construction converts it to a DFA, and minimization delivers the optimal DFA. Going backwards, state elimination with Arden&#x27;s theorem turns the automaton back into a regex.&lt;/aside&gt;

    &lt;div class=&quot;grid grid-cols-12 gap-4&quot;&gt;

          &lt;span style=&quot;font-family:var(--font-heading);font-size:var(--fs-micro);color:var(--accent);&quot;&gt;THE BOSS THAT COUNTS&lt;/span&gt;

        &lt;div class=&quot;mt-3 glow-green&quot; style=&quot;font-family:var(--font-num);font-weight:700;font-size:21px;&quot;&gt;L = { a&lt;sup&gt;n&lt;/sup&gt;b&lt;sup&gt;n&lt;/sup&gt; | n ≥ 1 }&lt;/div&gt;
        &lt;p class=&quot;mt-2&quot; style=&quot;font-size:var(--fs-body);line-height:1.55;&quot;&gt;n jump-charges then &lt;b&gt;EXACTLY n&lt;/b&gt; releases. The machine must &lt;b class=&quot;glow-pink&quot;&gt;COUNT&lt;/b&gt;, not just react.&lt;/p&gt;

        &lt;p class=&quot;mt-2&quot; style=&quot;font-family:var(--font-num);font-size:var(--fs-small);line-height:1.6;&quot;&gt;if L is regular, there is a length p such that every s ∈ L with |s| ≥ p splits as s = xyz where:&lt;/p&gt;
        &lt;div class=&quot;grid grid-cols-3 gap-2 mt-2.5&quot;&gt;
          &lt;div style=&quot;border:1px solid rgba(143,163,184,.25);border-radius:8px;padding:8px 6px;text-align:center;font-family:var(--font-num);font-size:var(--fs-small);&quot;&gt;&lt;span class=&quot;glow-green&quot;&gt;①&lt;/span&gt; |xy| ≤ p&lt;/div&gt;

    &lt;/div&gt;

        &lt;span style=&quot;font-family:var(--font-num);font-size:var(--fs-small);line-height:1.5;&quot;&gt;Since |xy| ≤ p, the pump string y can only hold a&#x27;s: y = a&lt;sup&gt;k&lt;/sup&gt;, k ≥ 1.&lt;/span&gt;

const SLIDES = [{"title": "BOSS LEVEL — The Automata Behind Game AI", "player": "PLAYER 1", "window": "0:00-0:20", "notes": "Hey everyone, welcome! I'm Player 1, and this is BOSS LEVEL — The Automata Behind Game AI, our CS3703 CIE-3 video presentation. The one-line premise: every game you play secretly runs on machines we can prove things about. Our full team details and USNs appear in the video intro and in the file information. Let's press start."}, {"title": "Players Ready — Team Profile", "player": "PLAYER 1", "window": "0:20-0:50", "notes": "Quick squad roll-call. Player 1 — me, the host: I open the mission and land the real-world wrap and game-over sign-off. Player 2 is our DFA engineer — formal definition, transition table, final recap. Player 3 is the boss brain — nondeterminism, subset construction, Moore and Mealy. Player 4 hunts patterns — regular expressions and the pumping-lemma proof. All four of us present our own segments on camera, and every name plus USN is also written into the file information."}, {"title": "The Mission — Build a Boss AI in 3 Levels", "player": "PLAYER 1", "window": "0:50-1:25", "notes": "Here's the mission. Every game you love runs on machines you can prove things about — so today we design one boss enemy, level by level, and back every design choice with Theory of Computation. Level 1, Patrol Protocol — alphabet, strings and the DFA — that's Player 2 on core models. Level 2, Boss Brain — the NFA and output machines — belongs to Player 3. Level 3, Combo Mode — regular expressions and the pumping lemma — is Player 4's pattern hunt. And we promise: at least one worked example and one full proof during the run."}, {"title": "LEVEL 1 — Patrol Protocol", "player": "PLAYER 1 · handover to P2", "window": "1:25-2:00", "notes": "Level 1 begins. Look at any game character — it is secretly a machine, and we can prove it. The buttons on your controller? That's the alphabet Sigma. A sequence of moves — left, right, jump, dash? That's a string over Sigma. And the set of legal behaviours the character can perform is a language — a subset of Sigma star. Three everyday game ideas become three formal objects. Level 1 execution is yours now, Player 2 — show us the machine."}, {"title": "The DFA — One Exact Move Per Input", "player": "PLAYER 2", "window": "2:00-3:00", "notes": "Thanks, Player 1 — Level 1 is mine. Formally, a deterministic finite automaton is a five-tuple: M equals (Q, Sigma, delta, q-zero, F). Q is the states — what our enemy is doing: S0 idle, S1 tap-one, S2 dash. Sigma is the alphabet — controller events per frame: t is a tap, o is any other input. Delta is the rulebook: a state plus a symbol gives exactly one next state — never a choice, never a maybe. That is determinism: one memory lookup per frame, which is why engines love DFAs. q-zero is the spawn state, always S0, and F is the accepting set — just S2, the frame the dash fires. Acceptance means the input string ends in t-t — the double-tap detector. Next slide: the full transition table and a live trace."}, {"title": "Transition Table & Deterministic Trace", "player": "PLAYER 2 · handover to P3", "window": "3:00-4:00", "notes": "Let's read the rulebook as a table. Three states, two symbols — and notice every cell holds exactly one move. Now watch the engine trace the input t-o-t-t. First chip: t takes S0 to S1 — one tap logged. Second chip: o is any other input, and S1 falls straight back to S0 — wrong rhythm, the engine resets. Third chip: t again, S0 to S1. Fourth chip: t — S1 jumps to S2, so the dash fires. Accepted! Now the contrast: t-o ends in S0 with no dash — rejected. So the language this DFA accepts is exactly the set of strings ending in t-t: the double-tap detector. Same state plus same symbol always gives the same next state — determinism, one memory lookup per frame. That closes Level 1. Player 3, the boss brain is yours."}, {"title": "LEVEL 2 — Boss Brain", "player": "PLAYER 3", "window": "4:00-4:35", "notes": "Thanks, Player 2 — I've got the boss brain. Strict determinism is a bad fit when the enemy faces uncertain situations: the same input may deserve different reactions depending on context. So real bosses keep their options open — that's nondeterminism, and Level 2 is where we build it. We'll meet the NFA, epsilon-moves that jump without consuming input, the subset construction that proves an NFA equals a DFA, then minimization and Moore-Mealy output machines. First up: a cheat-code detector — watch this."}, {"title": "The NFA — Many Moves, One Energy Bar", "player": "PLAYER 3", "window": "4:35-5:40", "notes": "Here's the boss: the Konami code — up, up, down, down, left, right, left, right, B, A — can appear anywhere inside a long input stream, so the engine keeps a scanner state s that eats any symbol and stays in s. On the first up-arrow it also branches into c1 — two live choices at once. That's nondeterminism: the machine explores every branch in parallel. We also get epsilon-moves: state switches that consume no input at all. Now the punchline — subset construction. A DFA simulates the NFA by tracking the SET of states it could be in, like fog-of-war tracking. Worst case that set explodes to two-to-the-n states, but the accepted language is identical. So NFAs and DFAs accept exactly the same languages — nondeterminism buys convenience, never extra power."}, {"title": "Patch Notes — Minimization + Moore & Mealy", "player": "PLAYER 3 · handover to P4", "window": "5:40-6:25", "notes": "Before we ship the boss, two patch notes. First, minimization: two states that answer every possible future input identically ARE the same guard — the table-filling algorithm merges them. Fewer states mean cheaper, faster AI, and Myhill-Nerode says a language is regular exactly when it has finitely many of those behaviour classes. Five states become three, zero gameplay lost. Second, machines with output. Moore paints output on the state — the HP bar's green, amber or red depends only on which state you're in. Mealy paints it on the arrow — the hit-spark fires exactly on a transition, state plus input together. Any Moore machine converts to a Mealy machine and back. Player 4 — combo mode is yours."}, {"title": "LEVEL 3 — Combo Mode", "player": "PLAYER 4", "window": "6:25-6:55", "notes": "Player 4 here — combo mode. Forget states for a second: a fighting-game special like down, down-forward, forward plus punch is a pattern written over the controller alphabet. Level 3 is about recognizing patterns. We'll build regular expressions, convert them both ways into finite automata, then hit the wall — the pumping lemma, the proof that finite memory ends — and close inside real engines. Let's run the combo."}, {"title": "Regular Expressions — The Combo Language", "player": "PLAYER 4", "window": "6:55-7:55", "notes": "[PLAYER 4 · 6:55–7:55] Level three continues — we stop listing states and start writing patterns. Regular expressions are the combo language, built from three operators. Union means \"or\": a union b accepts a or b. Concatenation means \"then\": a b fires a immediately followed by b. Kleene star means \"repeat\": a-star is zero or more a's — and binding runs star, then concatenation, then union. Two game examples. Input buffering: W-star A — any number of walk frames, then attack fires; one expression, infinite combos. Name check: a letter followed by letters, digits or underscores — the chat engine validates every new player name with one regex. Every regex compiles into a machine: Thompson construction builds an NFA with epsilon-moves, subset construction converts it to a DFA, and minimization delivers the optimal DFA. Going backwards, state elimination with Arden's theorem turns the automaton back into a regex."}, {"title": "The Wall — Why Finite Memory Is Not Enough", "player": "PLAYER 4", "window": "7:55-8:40", "notes": "[PLAYER 4 · 7:55–8:40] Every power-up has a wall — this is ours. The boss that counts demands n jump-charges and exactly n releases: the language a-n-b-n. The pumping lemma in plain words: if a language is regular, every long-enough string splits into x, y and z — y is non-empty, x-y stays inside the first p symbols, and pumping y any number of times keeps the string legal. Demolition: choose a-p b-p. Since x-y fits within the first p symbols, y can only hold a's. Pump twice — more a's than b's, so the pumped string is rejected. Contradiction: not regular. No DFA or regex can verify it. Counting needs memory that grows — a stack. That's Module four: pushdown automata."}, {"title": "It's Everywhere — Real Game Engines", "player": "PLAYER 1 returns", "window": "8:40-9:25", "notes": "[PLAYER 1 · 8:40–9:25] Player One back on the mic — and the achievement list is glowing. Pac-Man's ghosts have run scatter, chase and frightened as a classic finite state machine since 1980. Unity and Unreal animators literally are state machines — the states, transitions and conditions you drag on screen are the delta function. Chat and cheat filters scan text and inputs with regex pattern matching — the same finite-automaton power, live in multiplayer. And fighting-game combos sit in an input buffer until a DFA-like recognizer fires the special move on the exact frame. But here is where it ends: balanced dialogue trees, undo systems, inventory counts — finite automata cannot count. For that, games hand over to stacks and parsers. Modules three and four are waiting."}, {"title": "Level Complete — What We Proved", "player": "PLAYER 2", "window": "9:25-9:50", "notes": "[PLAYER 2 · 9:25–9:50] Results screen time. Controller buttons were our alphabet; combo sequences were strings; the full set of legal combos, a language. The double-tap dash was a complete DFA. The cautious boss was an NFA, fog-of-war tracking was the subset construction, twin guards merged via minimization and Myhill-Nerode, HP bars and hit-sparks gave us Moore and Mealy, cheat detection was regular expressions, and the counting boss fell to the pumping lemma. Four achievements unlocked: correct with examples, deep on equivalence and proof, ten minutes on the dot, and creative in the game-design narrative. Everyone on camera — sign-off time!"}, {"title": "Game Over? No — Game On.", "player": "ALL FOUR PLAYERS", "window": "9:50-10:15", "notes": "[ALL FOUR PLAYERS · 9:50–10:15] Final screen — all four players on camera. Player Four: from combo patterns to the pumping-lemma wall, Level three is complete. Player Three: the boss kept its options open, and the subset construction proved it deterministic anyway. Player Two: one dash, five states, zero doubt — the DFA checked out. Player One: every jump, patrol and combo you have ever played ran on machines we can prove things about. Thank you for watching — our names and USNs are stated on camera and in the file information. Game on!"}];
let cur = 0, navCount = 0, hudTimer = null, toastTimer = null;
const $ = id => document.getElementById(id);
const frames = [...document.querySelectorAll('iframe.sl')];
const pad = n => String(n).padStart(2, '0');

function replay(f){ try { f.contentWindow.postMessage({cmd:'replay'}, '*'); } catch(e){} }

function render(playAnim){
  frames.forEach((f,i)=>{ f.style.display = (i===cur) ? 'block' : 'none'; });
  const f = frames[cur];
  if (playAnim){
    f.classList.remove('in'); void f.offsetWidth; f.classList.add('in');
    const sw = $('sweep'); sw.classList.remove('go'); void sw.offsetWidth; sw.classList.add('go');
    replay(f);
  }
  const s = SLIDES[cur];
  $('prog').style.width = (100*(cur+1)/SLIDES.length) + '%';
  $('hud-num').textContent = `${pad(cur+1)} / ${pad(SLIDES.length)}`;
  $('n-title').textContent = `SLIDE ${pad(cur+1)} · ${s.title}`;
  $('n-player').textContent = s.player;
  $('n-window').textContent = s.window;
  $('n-words').textContent = `${s.notes.trim().split(/\s+/).length} words`;
  $('n-script').textContent = s.notes;
  if (playAnim){
    $('hud').classList.add('on');
    clearTimeout(hudTimer);
    hudTimer = setTimeout(()=> $('hud').classList.remove('on'), 1400);
  }
}

function go(d){
  const n = Math.min(SLIDES.length-1, Math.max(0, cur+d));
  if (n === cur) return;
  cur = n; render(true);
}
function jump(i){ cur = Math.min(SLIDES.length-1, Math.max(0,i)); render(true); }
function fs(){
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
}
function toggleNotes(force){ $('notes').classList.toggle('open', force); }
function toast(ms){
  $('toast').classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> $('toast').classList.remove('on'), ms);
}

function fit(){
  const w = $('wrap');
  const s = Math.min(w.clientWidth/1280, w.clientHeight/720);
  $('stage').style.transform = `scale(${s})`;
}

addEventListener('resize', fit);
addEventListener('keydown', e => {
  const k = e.key;
  if (k==='ArrowRight' || k==='PageDown' || k===' ') { e.preventDefault(); go(1); }
  else if (k==='ArrowLeft' || k==='PageUp') { e.preventDefault(); go(-1); }
  else if (k==='Home') { e.preventDefault(); jump(0); }
  else if (k==='End')  { e.preventDefault(); jump(SLIDES.length-1); }
  else if (k==='f' || k==='F') fs();
  else if (k==='n' || k==='N') toggleNotes();
  else if (k==='h' || k==='H' || k==='?') toast(4200);
  else if (k==='Escape') toggleNotes(false);
});

/* click = next · shift-click = prev (clicks inside the notes drawer are ignored) */
$('wrap').addEventListener('click', e => go(e.shiftKey ? -1 : 1));

fit();
render(true);
toast(3800);
</script>
